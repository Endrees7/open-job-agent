name: Tests (no secrets)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Offline demonstration
        run: python -m jobagent.cli demo --output build/report.json
      - name: Assert demo report has no auto applications
        run: python -c "import json; r=json.load(open('build/report.json')); assert r['jobs'] and all(j['auto_apply'] is False for j in r['jobs'])"
